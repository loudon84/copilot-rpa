name: CI

on:
  push:
    branches:
      - v0.1
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reject private test-server defaults
        shell: bash
        run: |
          if git grep -n '192\.168\.102\.247'; then
            echo 'Private test-server addresses must stay in local configuration.'
            exit 1
          fi

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Dependency consistency
        run: python -m pip check
